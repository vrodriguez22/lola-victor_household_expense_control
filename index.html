<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lola & Victor Expenses</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 to-purple-100">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col rounded-2xl overflow-hidden">

  <div class="p-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-center text-xl font-bold">
    Lola & Victor Household Expenses Control
  </div>

  <div class="p-3 flex gap-2 border-b">
    <select id="monthFilter" class="flex-1 border p-2 rounded text-sm"></select>
    <select id="categoryFilter" class="flex-1 border p-2 rounded text-sm"></select>
  </div>

  <div class="p-4 space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-indigo-50 p-3 rounded-xl">
        <div class="text-sm font-semibold text-gray-600">Current Month Total</div>
        <div id="total" class="text-xl font-bold">$0</div>
      </div>
      <div class="bg-purple-50 p-3 rounded-xl">
        <div class="text-sm font-semibold text-gray-600">Balance</div>
        <div id="balance" class="text-base font-semibold"></div>
      </div>
    </div>

    <div class="space-y-4">
      <div>
        <div class="text-base font-semibold text-gray-700 mb-1">Monthly Trend</div>
        <canvas id="trendChart"></canvas>
      </div>
      <div>
        <div class="text-base font-semibold text-gray-700 mb-1">Spending by Category</div>
        <canvas id="categoryChart"></canvas>
      </div>
    </div>
  </div>

  <div id="list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

  <div class="p-3 border-t flex justify-between items-center">
    <button onclick="downloadCSV()" class="text-sm text-gray-600">Export</button>
    <button onclick="openModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-full">+ Add</button>
  </div>
</div>

<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-end">
  <div class="bg-white w-full p-4 rounded-t-2xl">
    <form id="expenseForm" class="space-y-3">
      <input class="w-full border p-2 rounded" type="text" id="name" placeholder="Expense name" required />
      <input class="w-full border p-2 rounded" type="date" id="date" required />
      <input class="w-full border p-2 rounded" type="number" id="amount" placeholder="Amount" required />

      <select class="w-full border p-2 rounded" id="method">
        <option>Cash</option>
        <option>Yappy</option>
        <option>Credit Card</option>
      </select>

      <select class="w-full border p-2 rounded" id="payer">
        <option>Victor</option>
        <option>Lola</option>
      </select>

      <input class="w-full border p-2 rounded" type="text" id="category" placeholder="Category" />

      <div class="flex gap-2">
        <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded">Save</button>
        <button type="button" onclick="closeModal()" class="flex-1 border py-2 rounded">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
// 🔥 STEP 1: ADD YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
    apiKey: "AIzaSyDLukjaIDjFphvo98iCDjigATLn_CtW5Vk",
    authDomain: "household-expenses-control.firebaseapp.com",
    projectId: "household-expenses-control",
    storageBucket: "household-expenses-control.firebasestorage.app",
    messagingSenderId: "1063791262444",
    appId: "1:1063791262444:web:260d97cc8bc14f307243c9",
    measurementId: "G-96HBDHMVN0"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let expenses = [];
let trendChart, categoryChart;

const list = document.getElementById('list');
const totalEl = document.getElementById('total');
const balanceEl = document.getElementById('balance');
const monthFilter = document.getElementById('monthFilter');
const categoryFilter = document.getElementById('categoryFilter');

// 🔥 REALTIME SYNC
function listenExpenses() {
  db.collection('expenses').orderBy('date','desc').onSnapshot(snapshot => {
    expenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    populateFilters();
    render();
  });
}

function populateFilters() {
  const months = [...new Set(expenses.map(e => e.date.slice(0,7)))].sort();
  const categories = [...new Set(expenses.map(e => e.category || 'Other'))];

  monthFilter.innerHTML = '<option value="all">All Months</option>' +
    months.map(m => `<option value="${m}">${m}</option>`).join('');

  categoryFilter.innerHTML = '<option value="all">All Categories</option>' +
    categories.map(c => `<option value="${c}">${c}</option>`).join('');
}

function getFilteredExpenses() {
  return expenses.filter(e => {
    const matchMonth = monthFilter.value === 'all' || e.date.startsWith(monthFilter.value);
    const matchCategory = categoryFilter.value === 'all' || (e.category || 'Other') === categoryFilter.value;
    return matchMonth && matchCategory;
  });
}

function aggregateMonthly(data) {
  const result = {};
  data.forEach(e => {
    const m = e.date.slice(0,7);
    if (!result[m]) result[m] = 0;
    result[m] += e.amount;
  });
  const labels = Object.keys(result).sort();
  return { labels, values: labels.map(l => result[l]) };
}

function aggregateCategory(data) {
  const result = {};
  data.forEach(e => {
    const c = e.category || 'Other';
    if (!result[c]) result[c] = 0;
    result[c] += e.amount;
  });
  return { labels: Object.keys(result), values: Object.values(result) };
}

function renderCharts(data) {
  const t = aggregateMonthly(data);
  const c = aggregateCategory(data);

  if (trendChart) trendChart.destroy();
  if (categoryChart) categoryChart.destroy();

  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: t.labels, datasets: [{ data: t.values }] },
    options: { plugins: { legend: { display: false } } }
  });

  categoryChart = new Chart(document.getElementById('categoryChart'), {
    type: 'bar',
    data: { labels: c.labels, datasets: [{ data: c.values }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

function deleteExpense(id) {
  if (!confirm('Delete this expense?')) return;
  db.collection('expenses').doc(id).delete();
}

function render() {
  const data = getFilteredExpenses();
  list.innerHTML = '';

  let total = 0, v = 0, l = 0;

  data.forEach(e => {
    total += e.amount;
    if (e.payer === 'Victor') v += e.amount;
    else l += e.amount;

    const card = document.createElement('div');
    card.className = 'bg-white border p-3 rounded-xl shadow-sm';

    card.innerHTML = `
      <div class="flex justify-between items-start">
        <div>
          <div class="font-semibold">${e.name || 'Unnamed'}</div>
          <div class="text-xs text-gray-500">${e.date} • ${e.category || ''}</div>
        </div>
        <div class="text-right">
          <div class="font-bold text-indigo-600">$${e.amount}</div>
          <div class="text-xs text-gray-500">${e.payer}</div>
          <button onclick="deleteExpense('${e.id}')" class="text-xs text-red-500 mt-1">Delete</button>
        </div>
      </div>`;

    list.appendChild(card);
  });

  totalEl.innerText = '$' + total.toFixed(2);

  const diff = v - l;
  if (diff > 0) balanceEl.innerText = `Lola owes Victor $${(diff/2).toFixed(2)}`;
  else if (diff < 0) balanceEl.innerText = `Victor owes Lola $${(Math.abs(diff)/2).toFixed(2)}`;
  else balanceEl.innerText = 'All settled ✅';

  renderCharts(data);
}

monthFilter.addEventListener('change', render);
categoryFilter.addEventListener('change', render);

function openModal(){ document.getElementById('modal').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

document.getElementById('expenseForm').addEventListener('submit', async e => {
  e.preventDefault();

  await db.collection('expenses').add({
    name: document.getElementById('name').value || 'Unnamed',
    date: document.getElementById('date').value,
    amount: parseFloat(document.getElementById('amount').value),
    method: document.getElementById('method').value,
    payer: document.getElementById('payer').value,
    category: document.getElementById('category').value
  });

  closeModal();
  e.target.reset();
});

function downloadCSV() {
  let csv = 'Name,Date,Amount,Method,Payer,Category\n';
  expenses.forEach(e => {
    csv += `${e.name},${e.date},${e.amount},${e.method},${e.payer},${e.category}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'expenses.csv';
  a.click();
}

listenExpenses();
</script>

</body>
</html>
